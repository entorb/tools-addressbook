name: Check Code and Test Python Project

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1 # latest only

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          # here no pip cache needed, if no packages installed
          # pre-commit has its own cache
          # cache: "pip"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run prek pre-commit
        uses: j178/prek-action@v3.0.0

      - name: Run markdownlint
        run: npm exec markdownlint-cli2 "**/*.md"

      - name: Run cspell
        run: npm exec cspell-cli --gitignore --unique --silent .

      - name: Install dependencies
        if: ${{ hashFiles('requirements.txt') != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest unittests
        run: |
          cp bday_mail_sender_today_config-EXAMPLE.py bday_mail_sender_today_config.py
          pip install pytest
          pytest
